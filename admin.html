<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão - Fire Burger</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; padding-bottom: 50px;}
        .header-admin { display: flex; justify-content: space-between; align-items: center; background: #121212; color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; margin-top: 40px;}
        .header-admin h1 { margin: 0; font-size: 24px; color: #ff5e00; }
        .btn-novo { background-color: #2ed573; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s;}
        .btn-novo:hover { background-color: #26b963; }
        table { width: 100%; background: white; border-collapse: collapse; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f1f2f6; color: #555; font-weight: 500; }
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; color: white; }
        .status-ativo { background-color: #2ed573; }
        .status-inativo { background-color: #ff4757; }
        .btn-acao { padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-toggle { background-color: #dfe4ea; color: #2f3542; }
        
        .estoque-baixo { color: #ff4757; font-weight: bold; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-conteudo { background: white; padding: 30px; border-radius: 10px; width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-conteudo h2 { margin-top: 0; margin-bottom: 20px; color: #121212; }
        .modal-conteudo input, .modal-conteudo select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .modal-botoes { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
        .btn-cancelar { background-color: #dfe4ea; color: #333; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- SESSÃO 1: PRODUTOS -->
    <div class="header-admin" style="margin-top: 0;">
        <h1>🍔 Gestão do Cardápio</h1>
        <button class="btn-novo" onclick="abrirModalAdmin()">+ Novo Produto</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome do Produto</th>
                <th>Categoria</th>
                <th>Preço</th>
                <th>Status</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody id="tabela-produtos">
            <tr><td colspan="6" style="text-align: center;">Carregando produtos...</td></tr>
        </tbody>
    </table>

    <!-- SESSÃO 2: ESTOQUE (NOVO) -->
    <div class="header-admin">
        <h1>📦 Controle de Estoque (Ingredientes)</h1>
        <button class="btn-novo" onclick="alert('Em breve: Formulário de nova matéria-prima!')">+ Nova Matéria-Prima</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Matéria-Prima</th>
                <th>Unidade</th>
                <th>Saldo Atual</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody id="tabela-estoque">
            <tr><td colspan="5" style="text-align: center;">Carregando estoque...</td></tr>
        </tbody>
    </table>

    <!-- Modal de Novo Produto -->
    <div id="modal-novo-produto" class="modal-overlay">
        <div class="modal-conteudo">
            <h2>Cadastrar Lanche</h2>
            <input type="text" id="novo-nome" placeholder="Nome do Lanche">
            <input type="text" id="novo-descricao" placeholder="Descrição">
            <input type="number" id="novo-preco" placeholder="Preço" step="0.01">
            <select id="novo-categoria">
                <option value="Artesanal">Artesanal</option>
                <option value="Smash">Smash</option>
                <option value="Bebidas">Bebidas</option>
            </select>
            <input type="text" id="novo-imagem" placeholder="Link da Imagem (URL)">
            <div class="modal-botoes">
                <button class="btn-cancelar" onclick="fecharModalAdmin()">Cancelar</button>
                <button class="btn-novo" onclick="salvarNovoProduto()">Salvar Produto</button>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
